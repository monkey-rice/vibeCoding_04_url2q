<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR 코드 생성기</title>
    <link rel="stylesheet" href="style.css">
    <!-- QR 코드 생성을 위한 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <header class="top-header">
        <!-- 1. 화면 상단 좌측에 img 폴더 안의 로고 이미지 배치 -->
        <img src="img/logo.png" alt="Logo" class="logo">
    </header>

    <main class="container" id="main-container">
        <!-- 3. 생성될 QR 코드 (초기에는 숨김 상태) -->
        <div class="qr-section" id="qr-section">
            <!-- 4. 클릭 시 다운로드 기능을 위해 title 속성 추가 -->
            <div id="qrcode" class="qrcode-wrapper" title="클릭하여 JPG로 다운로드"></div>
            <p class="hint">QR코드를 클릭하면 JPG 파일로 다운로드됩니다.</p>
        </div>

        <!-- 2. 중앙에 위치한 심플한 URL 입력창 -->
        <div class="input-section" id="input-section">
            <input type="text" id="url-input" placeholder="웹사이트 주소(URL)를 입력하세요">
            <button onclick="generateQR()">확인</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
