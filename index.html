<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 툴박스 - QRnShort</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>스마트 툴박스 🧰</h1>
        <p class="subtitle">QR코드 생성 및 URL 단축 서비스</p>
        
        <div class="tab-container">
            <button class="tab-btn active" onclick="switchTab('qr')">QR코드 생성</button>
            <button class="tab-btn" onclick="switchTab('shorten')">URL 단축</button>
        </div>

        <div id="qr-section" class="content-section active">
            <h2>QR코드 만들기</h2>
            <input type="text" id="qr-input" placeholder="웹사이트 주소(URL)를 입력하세요">
            <button onclick="generateQR()" class="action-btn">QR 생성하기</button>
            <div class="result-box" id="qr-result">
                <p class="placeholder-text">이곳에 QR코드가 나타납니다.</p>
                <img id="qr-image" src="" alt="QR Code">
            </div>
        </div>

        <div id="shorten-section" class="content-section">
            <h2>URL 단축하기</h2>
            <input type="text" id="shorten-input" placeholder="단축할 긴 URL을 입력하세요 (예: https://...)">
            <button onclick="shortenURL()" class="action-btn">URL 단축하기</button>
            <div class="result-box" id="shorten-result">
                <p class="placeholder-text">이곳에 단축된 URL이 나타납니다.</p>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
